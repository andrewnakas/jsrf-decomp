# exception-handling stubs of the functions in 0x15fa30-0x17bf40, and of two C++ runtime functions
[[owners.ranges]]
start = "0x18a380"
end = "0x18aca2"
owner = "musashi"

[[owners.ranges]]
start = "0x18aca2"
end = "0x18acc0"
owner = "lib:crt"

[inventory]
# 0xc0470, 0xc0490 and 0xc04a0 are three functions: each ends in its own ret and each is an
# entry of the vtable at 0x1cdc1c (slots 0x1cdc1c, 0x1cdc20, 0x1cdc24). No code calls the last two.
known_starts = ["0xc0490", "0xc04a0"]
# 0x4c8a0 is the last ret of the function at 0x4c400, reached through that function's jump
# table, and 0x4c8a4 is the table itself (12 entries, all pointing into the function).
not_starts = ["0x4c8a0", "0x4c8a4"]
