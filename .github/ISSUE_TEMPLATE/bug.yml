name: Build or setup problem
description: Installing the tools, running the compiler under Wine, or `xbx gate toolcheck` fails on your machine
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, its full output, your OS, Python and Wine versions. Never attach game files or compiler files.
      render: text
    validations:
      required: true
