# Progress for ByteMatch (bytematch.dev): an objdiff-format report.json that `xbx report` builds from
# config/functions.csv and the unit files only (no game data, no compiler). Every merged unit passed the
# match and build gates on the judge box, so each unit in src/funcs counts as a 100% match, and each unit
# in src/nonmatching counts with its verified /* fuzzy: */ score. ByteMatch reads the artifact named
# <VERSION>_report from successful push runs on main. If the BYTEMATCH_TOKEN secret is set, the report is
# also POSTed to the upload API.
name: progress

# Only main: ByteMatch reads main's runs, and Steward computes a PR's progress itself. With merges every
# couple of minutes, a run that a newer push cancels would never finish, so a run in flight is kept and
# only the newest waiting one runs after it (2026-11-20: cancelling left main without a report for hours).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: progress-main
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      VERSION: "5345000A"
      BYTEMATCH_TOKEN: ${{ secrets.BYTEMATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned xbx tools
        run: pip install -r requirements.txt
      - name: Generate report.json
        run: xbx report -o "build/report/$VERSION/report.json"
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}_report
          path: build/report/${{ env.VERSION }}/report.json
          if-no-files-found: error
      - name: Upload to ByteMatch API (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BYTEMATCH_TOKEN != ''
        run: |
          gzip -c "build/report/$VERSION/report.json" | curl --fail -sS -X POST \
            -H "Authorization: Bearer $BYTEMATCH_TOKEN" -H "Content-Encoding: gzip" --data-binary @- \
            "https://bytematch.dev/api/v1/projects/${GITHUB_REPOSITORY}/reports?version=$VERSION&commit=$GITHUB_SHA"
