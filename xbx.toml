# Project description for the decompathon-xbox tools (xbx). Changing this file
# is a tooling change: it re-judges every unit.

[project]
name = "jsrf-decomp"
version = "5345000A"          # the XBE's title id; the label of the progress report

[image]
path = "orig/default.xbe"     # your own copy, never committed (XBX_XBE overrides)
sha256 = "fd19055756719893c466302809b433b785ecf5732df0441286f3f605f0f3ef9c"
# .text also holds the linked libraries; the other sections belong to one each
code_sections = [".text", "D3D", "DSOUND", "MMATRIX", "XGRPH", "XPP"]

[compiler]
profile = "msvc7.0"
banner = "13.00.9466"
cflags = ["/O2", "/GX"]
# /Oy-: 12 game functions keep a frame pointer with no exception handling and no stack alignment
# (0x14370, 0x15520, 0x23f20, 0x47160, 0x47230, 0x50690, 0xa2960, 0xa6dc0, 0xc3a60, 0xd27f0, 0xe45d0,
# 0xedc30), while their neighbours have none: STATUS.md, "How the flags were pinned"
allowed_cflags = ["/Oy-"]
includes = ["include", "include/game", "include/sdk"]

[layout]
functions = "config/functions.csv"
matched = "src/funcs"
nonmatching = "src/nonmatching"
unit_glob = "func_*.cpp"
symbols = "config/symbols.csv"

[owners]
# The headline counts the game's own code and the two blocks of engine code linked with it
# (STATUS.md, "What is in .text"). The lib: owners are a separate category.
headline = ["game", "engine", "musashi"]

[owners.sections]
D3D = "lib:d3d8"
DSOUND = "lib:dsound"
XGRPH = "lib:xgraphics"
XPP = "lib:xpp"

# Library code inside .text, which has no section of its own. Every range is on function-table
# row boundaries; the evidence for each is in STATUS.md ("What is in .text").
[[owners.ranges]]
start = "0x13a570"
end = "0x145560"
owner = "lib:adx"

[[owners.ranges]]
start = "0x145560"
end = "0x14b774"
owner = "lib:xapi"

[[owners.ranges]]
start = "0x14b774"
end = "0x14b77c"
owner = "lib:dsound"

[[owners.ranges]]
start = "0x14b77c"
end = "0x14b7a0"
owner = "lib:xboxkrnl"

[[owners.ranges]]
start = "0x14b7a0"
end = "0x15fa30"
owner = "engine"

[[owners.ranges]]
start = "0x15fa30"
end = "0x17bf40"
owner = "musashi"

[[owners.ranges]]
start = "0x17bf40"
end = "0x182b81"
owner = "lib:crt"

[[owners.ranges]]
start = "0x182b81"
end = "0x182c97"
owner = "lib:xapi"

[[owners.ranges]]
start = "0x182c97"
end = "0x18694a"
owner = "lib:xgraphics"

[[owners.ranges]]
start = "0x18694a"
end = "0x186950"
owner = "lib:xboxkrnl"

[[owners.ranges]]
start = "0x186950"
end = "0x186b80"
owner = "engine"

[[owners.ranges]]
start = "0x186b80"
end = "0x186ba0"
owner = "lib:crt"

# exception-handling stubs of the functions in 0x15fa30-0x17bf40, and of two C++ runtime functions
[[owners.ranges]]
start = "0x18a380"
end = "0x18aca2"
owner = "musashi"

[[owners.ranges]]
start = "0x18aca2"
end = "0x18acc0"
owner = "lib:crt"

[inventory]
# 0xc0470, 0xc0490 and 0xc04a0 are three functions: each ends in its own ret and each is an
# entry of the vtable at 0x1cdc1c (slots 0x1cdc1c, 0x1cdc20, 0x1cdc24). No code calls the last two.
known_starts = ["0xc0490", "0xc04a0"]
# 0x4c8a0 is the last ret of the function at 0x4c400, reached through that function's jump
# table, and 0x4c8a4 is the table itself (12 entries, all pointing into the function).
not_starts = ["0x4c8a0", "0x4c8a4"]

[names]
# Functions the linker folded together. 0x11c90 (a bare ret) fills slots 1, 2, 4, 5, ... and 0x11c80
# (ret 4) slots 3, 6, ... of Node's vtable at 0x1c4390, and both fill two or more slots of the same
# vtable in about 200 others: each is many source functions. Units may name them func_00011C90_1 ...
# 0x7e020 is slot 3 of the tables at 0x1ccb28 and 0x1ccf38, whose classes are both direct children of
# Node (their destructors 0x728c0 and 0x7e010 jump straight to Node's): two overrides, folded.
# The others each fill two slots of one vtable (a table the code stores at offset 0 of an object), or, for
# 0x115f40, slot 9 of 0x1d3770 and slot 3 of 0x1d07f8: 0x23f10 (0x1d7778), 0x461a0, 0xaee80 (0x1ca788),
# 0xaecc0 (59 vtables), 0xb3de0 (66), 0xc6090 (0x1ce178), 0xc7cd0 and 0xc7db0 (0x1ce1c8 and five others),
# engine 0x14d080, 0x1504b0, 0x150fd0 (0x1e0f00), 0x1526d0 (0x1e12d8), 0x157f20 (0x1e1478), musashi
# 0x167c90, 0x167cb0, 0x167cc0 (0x1e3828).
# 0x50330 is slot 1 of 0x1cabd8 and 0x1cac18, two sibling classes (constructors 0x55ca0 and 0x50270 both
# call 0x12170's constructor; the parent's slot 1 is 0x11c90). 0x121b0 is slot 0 (the deleting destructor)
# of 0x1c43d8 and 0x1c4418, whose classes both derive from Node directly (constructors 0x12170 and 0x121e0
# call 0x12100): two deleting destructors folded, and 0x121d0, the implicit destructor they call, with them.
# Lane 2 (round 3): 0xae660 is slot 6 of 17 Node classes whose destructors each jump to Node's; 0x96f60 slot 5
# of six of them (destructors 0x948f0, 0x95ff0, 0x964b0, 0x96920, 0x96ab0, 0x96f00) and 0x967b0 slot 6 of four;
# 0x96980 and 0x96f80 slots 2 and 3 of both 0x1cd360 and 0x1cd3e0; 0xc44f0 and 0xc4060 are shared by 0x1cddb8
# and 0x1cddcc; 0xc5810 and 0xc5800 by four children of 0x1cde60, and 0xc55f0 is slot 16 of three of them.
# Lane 3 (round 2): 0x113cd0 is slot 1 of 0x1d2ae8, 0x1d2bb0 and 0x1d2b28, whose constructors (0x113a30,
# 0x115770, 0x114250) each call 0x12170 and then store only their own table.
# Lane 2 (round 4): 0xe7eb0 (mov [ecx], 0x1ce304; ret) is the inline destructor of several classes: the deleting
# destructors 0xcd890, 0xd6530, 0xdba90, 0xe05e0, 0xe8170, 0xef940 and about 20 unwind funclets call it.
# Lane 4 (MUSASHI round 2), the same COM method in unrelated classes: AddRef 0x177fe0 is slot 1 of about 33
# tables; QueryInterface 0x179350 and Release 0x1664d0 are slots 0 and 2 of all eight class factories
# (0x1e185c ... 0x1e4190); the Releases 0x165570 (0x1e1fe4, 0x1e2008, 0x1e3c80, 0x1e410c), 0x165e90
# (0x1e202c, 0x1e3fb0, 0x1e4130, 0x1e41d8), 0x16fce0, 0x1766a0, 0x17b6a0 fill slot 2 of two to four each;
# 0x160e80 is slot 0 of 0x1e18f4 and 0x1e194c (the logic_error and length_error deleting destructors).
# Lane 5 (engine round 1), one function in unrelated engine tables: 0x14d4a0 (0x1e10e8 family, 0x1e1248),
# 0x14e1f0 (0x1e1220, 0x1e1290 family, 0x1e1640), 0x1532f0 (0x1e12f8, 0x1e13f0, 0x1e1478 family), 0x15f1b0
# and 0x15f450 (0x1e1798, 0x1e17bc/0x1e17e0), 0x157f00 (slot 0 of 0x1e1478, 0x1e14d8, 0x1e1598, 0x1e17bc),
# 0x157f30 (0x1e1478[5], 0x1e17bc[8]), 0x1583f0 (0x1e1498[4], 0x1e1640[4]); 0x157f10 is slot 3 of 0x1e1478
# and also a game member called with two arguments at 0xcbdc1.
# Lane 2 (round 5): 0x33800 (mov eax, 1; ret 4) is Object_000265a0's member and is also called directly by
# 0xcbfc0 as a member of the owner object Object_000c5b50.
folded = ["0x11c90", "0x11c80", "0x7e020", "0x23f10", "0x461a0", "0xaecc0", "0xaee80", "0xb3de0", "0xc6090",
          "0xc7cd0", "0xc7db0", "0x115f40", "0x14d080", "0x1504b0", "0x150fd0", "0x1526d0", "0x157f20",
          "0x167c90", "0x167cb0", "0x167cc0", "0x50330", "0x121b0", "0x121d0",
          "0xae660", "0x96f60", "0x967b0", "0x96980", "0x96f80", "0xc44f0", "0xc4060", "0xc5810", "0xc5800",
          "0xc55f0", "0x113cd0", "0xe7eb0",
          "0x177fe0", "0x179350", "0x1664d0", "0x165570", "0x165e90", "0x16fce0", "0x1766a0", "0x17b6a0",
          "0x160e80",
          "0x14d4a0", "0x14e1f0", "0x1532f0", "0x15f1b0", "0x15f450", "0x157f00", "0x157f30", "0x1583f0",
          "0x157f10", "0x33800"]
# Data that a function keeps inside its own code. 0x1bc808 (XPP) jumps at 0x1bc851 over 27 bytes to 0x1bc86e;
# the game passes 0x1bc860, a device-type table among them, to 0x1bd5ff.
# 0x19b1ef-0x19e340 is a zero-filled gap between function rows of the D3D section that holds D3D's own
# globals; engine code reads and writes the dirty flags at 0x19ded8 and the render-state table at 0x19e0e0.
data_in_code = [["0x1bc853", "0x1bc86e"], ["0x19b1ef", "0x19e340"]]
